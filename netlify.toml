# Netlify 构建配置
#
# ⚠️ `command` 这一行**不能删**，哪怕它看起来什么都没干。
#
# Netlify 的优先级规则：netlify.toml 里**写了的字段**才覆盖后台(UI)设置，
# **没写的字段会回退到后台的设置**。2026-09-15 那次「修复」把 command 删掉了，
# 于是回退到后台里那个在本仓库跑不通的构建命令（本仓库没有 package.json），
# 结果从那天起**每一次部署都失败**，线上一直停在旧版 —— 症状很隐蔽：
# 推送成功、GitHub 上 dist 是新的、线上纹丝不动，看起来像"没触发部署"。
# 判断依据：Netlify 状态徽章显示 failed（成功是绿色，失败是浅红）。
#
# 因为这里显式给了一个必然成功的空操作命令，后台设置就再也影响不到构建。
#
# 为什么不在云端跑 `node build.js`：
# 产物由本地构建并提交到 dist/，云端只负责发布 —— 保证线上字节
# 与本地验证过的完全一致（版本戳也因此反映本地构建时间，不会变成云端 UTC 时间）。
[build]
  command = "echo use-committed-dist"
  publish = "dist"
