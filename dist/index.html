<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日语学习站 · 零基础 → N2 → N1</title>
<meta name="theme-color" content="#8b83f0">
<meta name="description" content="日语自学：五十音训练、SRS 单词卡、语法库、动词变形训练、学习仪表盘。零基础到 N1。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --bg:#0f1116; --bg2:#161922; --bg3:#1d2130; --bg4:#252a3a;
  --tx:#eceef4; --tx2:#a3aabd; --tx3:#6c7386;
  --bd:#272c3a; --bd2:#333a4d;
  --ac:#8b83f0; --ac2:#4fd1a5; --warn:#f2b34b; --err:#f2645a; --pink:#e879a8;
  --sh:0 4px 20px rgba(0,0,0,.28);
  --jp:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(1100px 520px at 12% -12%, rgba(139,131,240,.16), transparent 62%),
  radial-gradient(900px 460px at 92% 0%, rgba(79,209,165,.11), transparent 58%),
  var(--bg);
  color:var(--tx);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h2{font-size:21px;font-weight:600;margin:22px 0 14px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:4px;height:19px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
h3{font-size:15px;font-weight:600;margin:26px 0 10px;color:var(--tx)}
.jp{font-family:var(--jp)}

/* 顶栏 */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 24px;background:rgba(15,17,22,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--jp)}
.brand span{font-size:11px;color:var(--tx3);margin-left:10px;font-weight:400;font-family:inherit}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:7px 14px;border-radius:9px;font-size:14px;color:var(--tx2);transition:.16s}
.nav a:hover{background:var(--bg3);color:var(--tx)}
.nav a.on{background:linear-gradient(135deg,var(--ac),#6d63d8);color:#fff;box-shadow:0 3px 12px rgba(139,131,240,.3)}

main{max-width:1020px;margin:0 auto;padding:20px 24px 90px;min-height:70vh}
.foot{max-width:1020px;margin:0 auto;padding:18px 24px 44px;color:var(--tx3);font-size:12px;border-top:1px solid var(--bd);line-height:1.9}

/* 通用组件 */
.mgrid,.dgrid{display:grid;gap:14px;margin-bottom:16px}
.mgrid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dgrid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.mcard,.dbox{background:linear-gradient(160deg,var(--bg2),var(--bg3));border:1px solid var(--bd);
  border-radius:16px;padding:18px;text-align:center;transition:.18s;box-shadow:var(--sh)}
.mcard:hover{transform:translateY(-3px);border-color:var(--bd2)}
.mnum,.dnum{font-size:30px;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mlab,.dlab{font-size:12.5px;color:var(--tx2);margin:3px 0 11px}

.rowbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--tx2);font-size:13px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:11px 15px;margin:12px 0}
.rowbox b{color:var(--tx)}
.tip{color:var(--tx3);font-size:12.5px;margin:8px 0}

.btn{background:linear-gradient(135deg,var(--ac),#6d63d8);color:#fff;border:none;border-radius:10px;
  padding:9px 18px;font-size:14px;cursor:pointer;transition:.16s;box-shadow:0 3px 12px rgba(139,131,240,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(139,131,240,.35)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:1px solid var(--bd2);color:var(--tx2);box-shadow:none}
.btn.sm{padding:5px 12px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);border-radius:20px;padding:6px 14px;
  font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac);color:var(--tx)}
.chip.on{background:linear-gradient(135deg,var(--ac),#6d63d8);border-color:transparent;color:#fff}
.chip.playing{background:linear-gradient(135deg,var(--ac2),#3fb98f);border-color:transparent;color:#fff}
.chip.sm{padding:2px 10px;font-size:12px}
.chip.warn{border-color:var(--warn);color:var(--warn);cursor:default}
.chip.danger{border-color:var(--err);color:var(--err)}
.inp{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:9px 13px;font-size:14px;outline:none;transition:.15s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,131,240,.14)}
.inp.big{width:100%;font-size:18px;padding:13px 15px;margin:10px 0;font-family:var(--jp)}

/* 进度环 */
.ring{--p:0;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bg3) 0)}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg2)}
.ring span{position:relative;font-size:20px;font-weight:600}
.ringwrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--bd);
  border-radius:16px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh)}
.ringinfo{flex:1;min-width:200px}
.ringinfo .t{font-size:15px;font-weight:600;margin-bottom:6px}
.ringinfo .d{font-size:12.5px;color:var(--tx2)}

/* XP 条 */
.xpbar{height:8px;background:var(--bg4);border-radius:5px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.xptxt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:5px}

/* 进度条 */
.lvgrid{margin:10px 0}
.lvrow{display:flex;align-items:center;gap:12px;margin:9px 0}
.lvname{width:34px;font-weight:600;color:var(--tx2);font-size:13px}
.bar{flex:1;height:9px;background:var(--bg4);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s;
  box-shadow:0 0 10px rgba(139,131,240,.4)}
.lvnum{font-size:11.5px;color:var(--tx3);min-width:190px}

/* 题目区 */
.qbox{background:linear-gradient(160deg,var(--bg2),var(--bg3));border:1px solid var(--bd);border-radius:18px;
  padding:26px;margin:16px 0;text-align:center;box-shadow:var(--sh);position:relative;overflow:hidden}
.qtitle{font-size:21px;margin-bottom:14px}
.qtitle.big2{font-size:64px;font-weight:600;font-family:var(--jp);
  background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.qask{font-size:15px;color:var(--tx2);margin-bottom:6px}
.qask b{color:var(--ac2)}
.rt{color:var(--tx3);font-size:15px;font-family:var(--jp)}
.tag{background:var(--bg4);border-radius:6px;padding:2px 9px;font-size:12px;color:var(--tx2)}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.opt{background:var(--bg3);border:1px solid var(--bd2);color:var(--tx);border-radius:12px;padding:12px 22px;
  font-size:16px;cursor:pointer;transition:.15s;min-width:82px;position:relative}
.opt:hover{border-color:var(--ac);transform:translateY(-2px);background:var(--bg4)}
.opt.big{font-size:30px;padding:14px 26px;font-family:var(--jp)}
.opt kbd{position:absolute;top:3px;left:6px;font-size:9px;color:var(--tx3);font-family:monospace}
.res{margin-top:12px;font-size:16px;min-height:26px}
.ok{color:var(--ac2)} .no{color:var(--err)}

/* 动效 */
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .34s ease}
.shake{animation:shake .42s ease}
.rise{animation:rise .32s ease both}
.combo{position:absolute;top:12px;right:18px;font-size:13px;color:var(--warn);font-weight:600;opacity:0;transition:.2s}
.combo.show{opacity:1;animation:pop .3s ease}
.combo b{font-size:19px}

/* 单词卡（3D 翻转） */
.card{margin:16px 0;perspective:1400px}
.cwrap{position:relative;min-height:250px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.card.flipped .cwrap{transform:rotateY(180deg)}
.cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(160deg,var(--bg2),var(--bg3));border:1px solid var(--bd);border-radius:18px;
  padding:26px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:center}
.cback{transform:rotateY(180deg)}
.cmeta{font-size:12px;color:var(--tx3);margin-bottom:14px}
.cfront{font-size:40px;margin:10px 0;font-family:var(--jp)}
.cfront ruby rt{font-size:15px;color:var(--tx2)}
.cmean{font-size:22px;color:var(--ac2);margin:16px 0;font-weight:500}
.grades{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.g{border:none;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer;color:#fff;transition:.15s}
.g:hover{transform:translateY(-2px)}
.g.again{background:#b03a35} .g.hard{background:#a5661c} .g.good{background:#2166ad} .g.easy{background:#12876c}
.g kbd{font-size:9px;opacity:.72;margin-left:5px;font-family:monospace}
.done{text-align:center;padding:58px 0;color:var(--tx2);font-size:18px}
.hint{font-size:11px;color:var(--tx3);margin-top:12px}
.hint kbd{background:var(--bg4);border:1px solid var(--bd2);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:10px}

/* 单词卡 · 练习方向 */
.chint{font-size:12px;color:var(--tx3);margin-top:6px;line-height:1.7}
.cmean.big{font-size:20px;line-height:1.75;max-width:92%;margin:12px auto}
.bigsay{width:104px;height:104px;border-radius:50%;margin:6px auto 2px;display:block;
  border:2px solid var(--ac);background:rgba(139,131,240,.12);color:var(--ac);
  font-size:38px;line-height:1;cursor:pointer;transition:.18s}
.bigsay:hover{background:linear-gradient(135deg,var(--ac),#6d63d8);color:#fff;border-color:transparent;transform:scale(1.05)}
.bigsay:active{transform:scale(.96)}

/* 语法 */
.glist{margin-top:12px}
.gitem{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:.16s}
.gitem:hover{border-color:var(--bd2)}
.gitem.on{border-color:var(--ac2);background:linear-gradient(160deg,var(--bg2),rgba(79,209,165,.06))}
.ghead{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
.ghead:hover{background:var(--bg3)}
.gname{font-weight:600;min-width:180px;font-family:var(--jp)}
.gmean{flex:1;color:var(--tx2);font-size:14px}
.gmark{font-size:12px;color:var(--tx3);border:1px solid var(--bd2);border-radius:14px;padding:2px 12px;cursor:pointer;transition:.15s}
.gitem.on .gmark{color:var(--ac2);border-color:var(--ac2)}
.gbody{padding:12px 16px 14px;border-top:1px solid var(--bd)}
.gform{font-size:13px;color:var(--tx3)}
.gex{font-size:17px;margin:8px 0;font-family:var(--jp)}
.gtr{font-size:14px;color:var(--tx2)}

/* 五十音图 */
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:12px 0}
.kcell{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center;
  cursor:pointer;transition:.15s}
.kcell:hover{border-color:var(--ac);transform:translateY(-2px);background:var(--bg3)}
.kcell .h{font-size:22px;font-family:var(--jp);line-height:1.2}
.kcell .k{font-size:15px;color:var(--tx3);font-family:var(--jp)}
.kcell .r{font-size:10px;color:var(--tx3)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--bd);padding:8px 10px;text-align:left}
.tbl th{background:var(--bg3);color:var(--tx2);font-weight:500}
.tbl td.big{font-size:20px;text-align:center;width:44px;font-family:var(--jp)}
.tbl tr:hover td{background:var(--bg2)}

/* 易混对 */
.cfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.cf{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px;transition:.16s}
.cf:hover{border-color:var(--ac);transform:translateY(-2px)}
.cfk{display:flex;gap:16px;justify-content:center;font-size:30px;margin-bottom:8px;font-family:var(--jp)}
.cfk span:first-child{color:var(--ac)} .cfk span:last-child{color:var(--ac2)}
.cfd{font-size:12px;color:var(--tx3);text-align:center}
.cfw{font-size:13px;color:var(--tx2);text-align:center;margin-top:6px}

/* 热力图 */
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;max-width:740px;margin:10px 0}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bg3);display:block;transition:.15s}
.heat i:hover{transform:scale(1.35)}
.heat .h1{background:#2b3a55}.heat .h2{background:#33566f}.heat .h3{background:#3d7d78}.heat .h4{background:#4fae8b}

/* 预测柱图 */
.forecast{display:flex;gap:8px;align-items:flex-end;height:96px;margin:10px 0}
.fc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.fc i{width:100%;background:linear-gradient(180deg,var(--ac),rgba(139,131,240,.25));border-radius:5px 5px 0 0;min-height:3px;transition:.3s}
.fc span{font-size:10px;color:var(--tx3)}
.fc em{font-size:11px;color:var(--tx2);font-style:normal}

/* 徽章 */
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.badge{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--bd);
  border-radius:12px;padding:8px 14px;font-size:12.5px;color:var(--tx3)}
.badge.got{border-color:var(--warn);color:var(--warn);background:linear-gradient(160deg,var(--bg2),rgba(242,179,75,.08))}
.badge .ic{width:22px;height:22px;border-radius:50%;background:var(--bg4);display:grid;place-items:center;font-size:11px}
.badge.got .ic{background:rgba(242,179,75,.18)}

/* Toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--bg4);
  border:1px solid var(--bd2);color:var(--tx);padding:11px 22px;border-radius:12px;font-size:14px;
  opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 快捷键条 */
.keys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--tx3);margin-top:14px}
.keys kbd{background:var(--bg4);border:1px solid var(--bd2);border-radius:5px;padding:2px 7px;font-family:monospace}

/* 发音设置 */
.audioset{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0 18px}
.audioset .arow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.audioset .alab{min-width:80px;font-size:13px;color:var(--tx3);font-weight:600}
.audioset .arow .chips{margin:0}
.audioset select{background:var(--bg4);border:1px solid var(--bd2);color:var(--tx);border-radius:10px;
  padding:7px 12px;font-size:13px;max-width:min(420px,100%);flex:1}
.audioset input[type=range]{flex:1;max-width:240px;accent-color:var(--ac)}
.audioset .aval{font-size:12px;color:var(--tx3);min-width:36px;font-variant-numeric:tabular-nums}
.audioset .atip{font-size:12px;color:var(--tx3);line-height:1.75;margin-top:8px}
.audioset .atip b{color:var(--tx2)}
.badge-live{display:inline-block;font-size:10px;background:linear-gradient(135deg,#12b886,#0ca678);color:#fff;
  border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.3px}

/* 我的词库 */
.cform{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.crow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.crow .inp{flex:1;min-width:150px}
.crow select.inp{flex:0 0 auto;min-width:90px}
.tip2{font-size:12px;color:var(--tx3);line-height:1.75}
textarea.inp.big2{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.8;
  resize:vertical;min-height:180px}
.gex{padding:10px 16px;font-size:13.5px;color:var(--tx2);border-top:1px solid var(--bd);line-height:1.7}
.gtr{font-size:12.5px;color:var(--tx3);margin-top:4px}
code{background:var(--bg4);border-radius:5px;padding:1px 6px;font-size:12px}

/* 文章精读 */
.rdopen{cursor:pointer;-webkit-user-select:none;user-select:none}
.rdopen:hover{border-color:var(--ac2)}
.rart{margin:14px 0}
.rline{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--bd);
  border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rside{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px}
.rnum{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.rsay{width:34px;height:34px;border-radius:50%;background:var(--bg4);border:1px solid var(--bd2);
  color:var(--tx2);font-size:15px;cursor:pointer;transition:.15s;line-height:1;padding:0}
.rsay:hover{background:linear-gradient(135deg,var(--ac),#6d63d8);border-color:transparent;color:#fff}
.rsay.playing{background:linear-gradient(135deg,var(--ac2),#3fb98f);border-color:transparent;color:#fff}
.rsay.slow{font-size:11px;color:var(--warn);border-color:rgba(216,164,60,.45)}
.rsay.slow:hover{background:linear-gradient(135deg,#d8a43c,#b3831f);border-color:transparent;color:#fff}
.rsay.slow.playing{background:linear-gradient(135deg,#d8a43c,#b3831f);border-color:transparent;color:#fff}
.slowrow{margin-top:10px}
.rbody{flex:1;min-width:0}
.rj{font-size:17px;line-height:1.9;color:var(--tx);font-family:var(--jp)}
.rk{font-size:12.5px;line-height:1.8;color:var(--tx3);margin-top:3px}
.rz{font-size:13px;line-height:1.8;color:var(--tx2);margin-top:5px;padding-left:9px;border-left:2px solid var(--bd2)}
.rgtags{font-size:11.5px;color:var(--ac2);margin-top:6px;letter-spacing:.2px}
.rrow{display:flex;gap:9px;align-items:flex-start}
.rsp{flex:0 0 auto;font-size:11px;font-weight:500;color:var(--ac2);background:rgba(139,131,240,.16);
  border-radius:5px;padding:2px 8px;margin-top:4px;white-space:nowrap;letter-spacing:.3px}
.rnote{font-size:12px;color:var(--tx3);text-align:center;margin:16px 0 10px;letter-spacing:.3px}
.rblank{font-size:19px;line-height:2;color:var(--tx);font-family:var(--jp);margin:12px 0}
.rblank .blank{color:var(--warn);border-bottom:2px solid var(--warn);padding:0 14px}

/* 内容去向提示条 */
.notebox{background:var(--bg2);border:1px solid var(--bd);border-left:3px solid var(--ac2);
  border-radius:10px;padding:11px 15px;margin:10px 0;font-size:12.5px;line-height:1.9;color:var(--tx2)}
.notebox b{color:var(--tx)}

/* 教材大纲 */
.tblist{margin-top:12px}
.tbitem{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;margin-bottom:9px}
.tbhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.tbno{font-size:12.5px;font-weight:600;color:var(--ac);background:rgba(139,131,240,.12);
  border-radius:6px;padding:2px 9px;flex:0 0 auto;white-space:nowrap}
.tbtopic{font-size:14px;color:var(--tx);flex:1;min-width:120px}
.tbcount{font-size:11.5px;color:var(--tx3);flex:0 0 auto}
.tbgrams{display:flex;flex-wrap:wrap;gap:6px}
.tbgram{font-size:12.5px;color:var(--tx2);background:var(--bg4);border:1px solid var(--bd);
  border-radius:7px;padding:3px 9px;line-height:1.6}
.tbgram:hover{border-color:var(--ac2);color:var(--tx)}

@media(max-width:640px){
  .audioset .alab{min-width:64px}
  .audioset select{max-width:100%}
  .crow .inp{min-width:120px}
}

@media(max-width:640px){
  .nav a{padding:6px 10px;font-size:13px}
  main{padding:16px 14px 60px}
  .gname{min-width:110px;font-size:14px}
  .qtitle.big2{font-size:48px}
  .cfront{font-size:32px}
  .heat{grid-template-columns:repeat(12,1fr)}
  .kgrid{gap:6px}
  .kcell .h{font-size:18px}
}

/* 已学词 · 随手翻看（浏览式，不是刷卡式） */
.svbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.svq{flex:1;min-width:170px}
.svlist{margin-top:10px}
.svrow{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1px solid var(--bd);
  border-radius:12px;padding:11px 14px;margin-bottom:8px;transition:.15s}
.svrow:hover{border-color:var(--bd2)}
.svleft{flex:1;min-width:0}
.svword{font-size:17px;line-height:1.6;color:var(--tx);font-family:var(--jp)}
.svword rt{font-size:10.5px;color:var(--tx3)}
.svzh{font-size:13px;line-height:1.7;color:var(--tx2);margin-top:3px}
.svzh.blind{filter:blur(5px);cursor:pointer;user-select:none;-webkit-user-select:none}
.svzh.blind:hover{filter:blur(3.5px)}
.svmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;
  font-size:11.5px;color:var(--tx3)}
.svtag{border:1px solid var(--bd2);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.svtag.ok{color:var(--ac2);border-color:var(--ac2)}
.svtag.weak{color:var(--warn);border-color:var(--warn)}
.svtag.bad{color:var(--err);border-color:var(--err)}
.svsay{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--bg4);border:1px solid var(--bd2);
  color:var(--tx2);font-size:14px;cursor:pointer;transition:.15s;font-family:inherit}
.svsay:hover{background:linear-gradient(135deg,var(--ac),#6d63d8);border-color:transparent;color:#fff}
.svempty{text-align:center;padding:34px 16px;color:var(--tx3);font-size:13.5px;line-height:2}

@media(max-width:640px){
  .svrow{padding:10px 12px;gap:9px}
  .svword{font-size:16px}
  .svsay{width:30px;height:30px}
}

/* 反应时间建议（客观评分锚点，防自欺） */
.gtime{font-size:12px;color:var(--tx2);margin:12px 0 4px;text-align:center}
.gtime b{color:var(--ac2);font-weight:500}
.g.rec{box-shadow:0 0 0 2px var(--ac2);border-color:var(--ac2)}
.g.rec kbd{background:var(--ac2);color:#0b0d12;border-color:transparent}

/* 例句（语境绑定 → 深加工编码） */
.ctxbox{margin-top:14px;padding:11px 13px;background:var(--bg3);border:1px solid var(--bd);
  border-left:3px solid var(--ac2);border-radius:10px;text-align:left}
.ctxhead{font-size:11.5px;color:var(--tx3);margin-bottom:7px;display:flex;align-items:center;gap:7px}
.ctxtag{background:var(--ac2);color:#0b0d12;border-radius:5px;padding:1px 6px;font-size:10.5px;flex:0 0 auto}
.ctxj{font-size:15px;line-height:1.75;color:var(--tx);font-family:var(--jp)}
.ctxz{font-size:12.5px;line-height:1.7;color:var(--tx2);margin-top:3px}

  /* ---------- 5. 语音：真人音源优先 + 智能 TTS 选音 ---------- */

  function scoreVoice(v) {

    if (/Aoi|Naoki|Shiori|Keita|Chihiro|Nanami/i.test(n)) s += 80;
    if (/Natural|Neural|Online|Cloud/i.test(n)) s += 30;
    if (/Ayumi|Haruka|Ichiro|Sayaka/i.test(n)) s += 20;

  function bestVoice() {
    const list = voiceList();

  function ttsUrl(kanji, kana, kanaOnly) {

    const key = (kanji || kana) + "|" + kana;
    const m = M[key];
    if (m === 1) { out.push(ttsUrl(kanji, kana, false)); }
    else if (m === 2) { out.push(ttsUrl(null, kana, true)); }
    else if (typeof m === "string") {
      const p = m.split("|");

  /* 音频缓存：Service Worker 会拦截 <audio> 请求并落缓存（跨域资源无 CORS，只能走 SW，

  const ACACHE = "jp-audio-v1";

  let cacheSupported = typeof caches !== "undefined";

    if (warmState.running) return Promise.resolve(warmState);
    const M = globalThis.AUDIO_MAP || {};
    const list = (VOCAB[lv] || []).filter(function (v) { return M[(v.w || v.k) + "|" + v.k]; });
    const urls = [];
    const seen = {};
    list.forEach(function (v) {
      const c = humanCandidates(v.w, v.k);
      if (c.length && !seen[c[0]]) { seen[c[0]] = 1; urls.push(c[0]); }

  /* 播放真人音：候选依次尝试，全程只回落一次，杜绝与 TTS 重叠串台 */
  function playHuman(cands, fallback, txt, mul) {

  /* ---------- 8. 视图：五十音 ---------- */
  let kanaState = { mode: "read", scope: "all" };

  /* ---------- 9. 视图：单词 SRS ---------- */
  // 学习 与 复习 是两套完全独立的状态：各自维护级别、课号范围、队列、进度
  let ls = { lv: savedLv("learn"), queue: [], idx: 0, show: false, lesson: 0, src: "", kind: "learn" };
  let rs = { lv: savedLv("review"), queue: [], idx: 0, show: false, lesson: 0, src: "", kind: "review", rmode: "due" };
  let vs = ls;   // 指向当前页面所用状态（进入路由时切换）
  let lastCardRoute = null, lastCardDay = "";   // 上次渲染的卡片页路由/日期：只有进入页面或跨天才重建队列
  let lastSpokenId = null;    // 听音模式：同一张卡只自动播放一次（翻面不重播）
  function setStateFor(route) { vs = (route === "review") ? rs : ls; }
  // 记住各页所选级别，避免每次刷新都回到 N5（教材内容在 N3/N2/N1，反复切很烦）
  function savedLv(kind) {
    const m = S.settings.lv || {};
    return LEVELS.indexOf(m[kind]) >= 0 ? m[kind] : "N5";
  }
  function rememberLv(st) {
    if (!S.settings.lv) S.settings.lv = {};
    S.settings.lv[st.kind] = st.lv;
    save();
  }
  function modeCounts(st) {
    return {
      due: dueList(st.lv, st.src, st.lesson).length,
      "new": newList(st.lv, 9999, st.lesson, st.src).length,
      learn: learnDue(st.lv, st.src, st.lesson).length,
      all: studiedList(st.lv, st.src, st.lesson, false).length,
      wrong: studiedList(st.lv, st.src, st.lesson, true).length

  }
  // 复习选词方式：due=只到期的（默认）/ all=学过的全部（自主复习）/ wrong=只练错词
  const RMODES = [["due", "到期待复习"], ["all", "全部已学"], ["wrong", "只练错词"]];
  function buildQueue(fresh, force) {
    const st = vs;
    // 正在学习步里的词（当日强化）：不占每日新词额度，两个页面都优先安排
    const ld = shuffle(learnDue(st.lv, st.src, st.lesson));
    if (st.kind === "review") {
      const rm = st.rmode || "due";
      if (rm === "all" || rm === "wrong") {
        // 自主复习：不看到期时间，把学过的词全给出来（已按最该复习的顺序排好，不再打乱）
        st.queue = studiedList(st.lv, st.src, st.lesson, rm === "wrong");
      } else {
        const rev = dueList(st.lv, st.src, st.lesson).filter(function (v) { return !isLearning(S.cards[v.id]); });
        // 失误过的词排最前 —— 在听写/翻译/精读里错过、或评过「忘记/困难」的，最该先补
        const weak = [], normal = [];
        rev.forEach(function (v) { ((S.cards[v.id].lp || 0) > 0 ? weak : normal).push(v); });
        st.queue = ld.concat(shuffle(weak), shuffle(normal));
      }
    } else {
      // 学习：本轮新词（受每日额度）+ 还没走完学习步的词
      // 每轮最多 10 个新词，避免一次给太多；force = 用户主动「超额再学」，忽略每日额度
      const quota = force ? 10 : Math.max(0, S.settings.newPerDay - S.today.new);
      st.queue = ld.concat(newList(st.lv, Math.min(quota, 10), st.lesson, st.src));
    }
    st.idx = 0; st.show = false;
  }
  // 队列走完后：把刚刚到期、且不在剩余队列里的学习步词补到队尾 ——
  // 否则「1 分钟后重来」在当轮永远等不到（队列已固定）
  function refillLearn(st) {
    const rest = st.queue.slice(st.idx);
    const extra = learnDue(st.lv, st.src, st.lesson).filter(function (v) { return rest.indexOf(v) < 0; });
    if (!extra.length) return false;
    st.queue = st.queue.concat(shuffle(extra).slice(0, 10));
    return true;
  }
  // 最近一次到期时间与排队数量（用于告知「下次复习」）
  function nextDueInfo(onlyReview) {
    let min = Infinity, cnt = 0;
    const now = Date.now();
    LEVELS.forEach(function (L) {
      VOCAB[L].forEach(function (v) {
        const c = S.cards[v.id];
        if (!c || !c.due || c.due <= now) return;
        if (onlyReview && isLearning(c)) return;   // 学习中的词单列，不算「下次复习」
        cnt++; if (c.due < min) min = c.due;
      });
    });
    return { at: min === Infinity ? null : min, cnt: cnt };
  }
  function fmtWhen(ts) {
    const d = new Date(ts), now = new Date(), diff = ts - Date.now();
    const hh = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    if (diff < 3600000) return "约 " + Math.max(1, Math.round(diff / 60000)) + " 分钟后";
    if (d.toDateString() === now.toDateString()) return "今天 " + hh;
    const tm = new Date(now.getTime() + 86400000);
    if (d.toDateString() === tm.toDateString()) return "明天 " + hh;
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hh;
  }
  // 队列走完时的收尾提示：必须说清「为什么没词了」，否则用户会以为按钮坏了

              : '<span>已学可练：<b>' + mc.all + '</b></span>')
        : '<span>今日新学：<b>' + S.today.new + '</b>/' + S.settings.newPerDay + '</span><span>今日额度剩余：<b>' + quotaLeft + '</b></span><span>未学词：<b>' + mc["new"] + '</b></span>')
      + (mc.learn ? '<span title="还没走完学习步的词（答错或刚学）">巩固中：<b>' + mc.learn + '</b></span>' : '')
      + '<span>本轮剩余：<b>' + Math.max(0, st.queue.length - st.idx) + '</b></span><button class="btn sm" id="vbuild">重抽本轮</button></div>';
    h += queueNote(st, mc, quotaLeft);
    h += '<div id="vcard" class="card"></div>';
    return h;
  }
  // 当前筛选范围的文字描述（来源 + 课次），用于提示「本轮词从哪来」
  function scopeLabel(st) {
    const parts = [];
    if (st.src === "base") parts.push("仅内置词");
    else if (st.src) parts.push(bookName(st.src));
    if (st.lesson > 0) parts.push("第 " + st.lesson + " 课");
    return parts.length ? "（" + parts.join(" · ") + "）" : "";
  }
  // 说明「为什么本轮只有这么几个词」——否则用户会以为重抽功能坏了
  function queueNote(st, mc, quotaLeft) {
    if (!st.queue.length) return "";   // 空队列的情况由 doneHTML 说明
    const scope = scopeLabel(st);
    const ld = mc.learn || 0;
    const ldTip = ld ? '其中 <b>' + ld + '</b> 个是<b>当天巩固</b>的词（答错或刚学，不占每日额度）' : "";
    if (st.kind === "review") {
      const rm = st.rmode || "due";
      if (rm === "all") {
        return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个学过的词' + scope
          + ' —— 不看到期时间，按<b>最久没复习</b>的顺序排（刚学完的也在最前面）。评分照常更新下次复习时间。</div>';
      }
      if (rm === "wrong") {
        return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个错词' + scope
          + ' —— 都是你评过「忘记 / 困难」的词；答对会移出错词本。</div>';
      }
      return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个待巩固词' + scope
        + (ldTip ? '，' + ldTip : "")
        + ' —— 走完就没了；没背过的新词不会出现在这里。想再过一遍已学的词，把上方「选词」切到<b>全部已学</b>。</div>';
    }
    if (st.lesson > 0) {
      return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个词' + scope + '。' + (ldTip ? ldTip + '。' : "") + '</div>';
    }
    if (quotaLeft < 10) {
      return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个 —— <b>今日新词额度只剩 ' + quotaLeft + ' 个</b>'
        + '（每日额度 ' + S.settings.newPerDay + ' 个，可在「仪表盘 → 每日新词」调整）。'
        + (ldTip ? ldTip + '。' : "")
        + '本级别还有 ' + mc["new"] + ' 个新词没学：<button class="chip sm" id="vforce2">超额再学 10 个</button></div>';
    }
    return '<div class="tip2">本轮 <b>' + st.queue.length + '</b> 个词（新词 + 还没记牢要重来的）。' + (ldTip ? ldTip + '。' : "") + '</div>';
  }
  function viewLearn() { return viewVocab(ls, false); }
  function viewReview() { return viewVocab(rs, true); }
  // 词形（ruby 注音可按设置开关；假名词本身无注音，不受影响）
  function wordHTML(v, withKana) {
    const base = esc(v.w || v.k);
    if (!v.w || !withKana) return '<div class="cfront jp">' + base + "</div>";
    return '<div class="cfront jp"><ruby>' + base + "<rt>" + esc(v.k) + "</rt></ruby></div>";
  }
  function sayWord(v, slow) { if (v) speak(v.k, { kanji: v.w, kana: v.k, mul: slow ? SLOW_RATE : 1 }); }
  /* ---------- 10c. 记忆增强：客观锚点 / 信号打通 / 方向进阶 / 语境界定 ---------- */
  /* A. 反应时间：从正面出现到翻面的耗时。
     「答对但想了 8 秒」和「1 秒内秒懂」不是一回事 —— 现在把耗时作为评分的客观锚点，
     在按钮上标出建议档位（不强制，只防自欺）。 */
  let cardShownAt = 0, timedKey = "";
  function markCardShown(v) {
    const key = v ? v.id : "";
    if (key !== timedKey) { timedKey = key; cardShownAt = Date.now(); vs.elapsed = 0; vs.hint = false; }
  }
  function elapsedMs() { return cardShownAt ? Math.max(0, Date.now() - cardShownAt) : 0; }
  /* 建议档位：0 忘记 / 1 困难 / 2 良好 / 3 简单 */
  function suggestGrade(ms, mode, usedHint) {
    let g;
    if (!ms) g = 2;
    else if (ms < 1500) g = 3;
    else if (ms < 4000) g = 2;
    else if (ms < 9000) g = 1;
    else g = 0;
    // 翻面前点了朗读 = 听了答案，最多只算「困难」；听音模式本来就要听，不算提示
    if (usedHint && mode !== "listen") g = Math.min(g, 1);
    return g;
  }
  function fmtSec(ms) { return (Math.max(0, ms) / 1000).toFixed(1); }

  /* C. 练习方向自动进阶：先建立形义联系 → 再练听解 → 最后练产出。
     只在「刚能认出来」的难度上练，记忆增长最慢，所以难度要跟着熟练度走。 */
  function dirOf(c) {
    const m = S.settings.cardMode || "auto";
    if (m !== "auto") return m;
    if (!c || isLearning(c)) return "word";        // 还没毕业 → 先建立形义联系
    const n = c.n || 0;
    if (n <= 2) return "word";
    if (n <= 4) return "listen";
    return "mean";
  }
  function dirLabel(d) { return d === "listen" ? "听音辨义" : d === "mean" ? "看义想词" : "看词想义"; }

  /* D. 失误过的词：答错时已经强制「1 分钟后重来」一次了，之后走更长的 10 → 60 分钟，
     毕业前多一个当天检查点（普通词是 1 → 10 分钟就毕业）。 */
  const LP_STEPS = [10, 60];

  /* B. 在别处（听写 / 翻译 / 精读填空）判错的词 → 立即回到复习队列。
     只「提前」不「延后」：不动 ef / n / 已经拉长的间隔，只把 due 拉到当前 + 记一次失误。
     所以你在任何地方暴露的薄弱点都会回来找你，而已经记牢的词不受影响。 */
  function flagWeak(id) {
    const c = S.cards[id];
    if (!c) return false;                          // 没学过的词不进 SRS
    c.lp = (c.lp || 0) + 1;
    if (isLearning(c)) c.st = -1;                  // 学习中的词打回第一步重走
    c.due = Date.now();                            // 立即到期，下次进队列就会出现
    save();
    return true;
  }

  /* E. 语境绑定：这个词出现在哪篇精读的哪一句；精读里没有，就退到语法库的例句。
     孤立映射「先生→老师」是浅编码，加上真实句子才是深加工。语料早就有了，只是没连起来。 */
  const ctxCache = {};
  function ctxCacheKeysClear() { for (const k in ctxCache) delete ctxCache[k]; }
  function ctxOf(v) {
    if (ctxCache[v.id] !== undefined) return ctxCache[v.id];
    const needles = [];
    if (v.w && v.w.length >= 2) needles.push(v.w);                      // 汉字优先（长且准）
    if (!needles.length && v.k && v.k.length >= 3) needles.push(v.k);   // 假名太短会误命中
    let hit = null;
    // ① 精读文章：有完整上下文，价值最高
    for (let i = 0; i < READING.length && !hit; i++) {
      const a = READING[i];
      for (let j = 0; j < a.s.length; j++) {
        const s = a.s[j];
        if (!s.j) continue;
        for (let n = 0; n < needles.length; n++) {
          if (s.j.indexOf(needles[n]) >= 0) { hit = { kind: "read", a: a, s: s }; break; }
        }
        if (hit) break;
      }
    }
    // ② 语法库例句：覆盖面大得多，作为兜底
    if (!hit && needles.length) {
      for (let i = 0; i < GRAMMAR.length && !hit; i++) {
        const g = GRAMMAR[i];
        if (!g.e) continue;
        for (let n = 0; n < needles.length; n++) {
          if (g.e.indexOf(needles[n]) >= 0) { hit = { kind: "gram", g: g, s: { j: g.e, z: g.t } }; break; }
        }
      }
    }
    ctxCache[v.id] = hit;
    return hit;
  }

  /* 词形 → 词 的反查表（懒加载）。精读填空挖掉的可能正是一个词，那就让它回到复习队列。 */
  let FORM_MAP = null;
  function formMap() {
    if (FORM_MAP) return FORM_MAP;
    const m = {};
    LEVELS.forEach(function (L) {
      VOCAB[L].forEach(function (v) {
        if (v.w && !m[v.w]) m[v.w] = v;
        if (v.k && !m[v.k]) m[v.k] = v;
      });
    });
    FORM_MAP = m;
    return m;
  }

  const CARD_MODES = [["auto", "自动进阶"], ["word", "看词想义"], ["listen", "听音辨义"], ["mean", "看义想词"]];
  function renderCard() {
    const box = $("#vcard"); if (!box) return;
    if (vs.idx >= vs.queue.length) refillLearn(vs);          // 刚到期的学习步词补到队尾
    if (vs.idx >= vs.queue.length) { box.innerHTML = doneHTML(); return; }
    const v = vs.queue[vs.idx];
    const c = S.cards[v.id];
    const mode = dirOf(c);              // 自动进阶：按熟练度选练法（顶部按钮可覆盖为固定方向）
    markCardShown(v);                   // 记录正面出现时刻，翻面时算反应时间
    const showKana = S.settings.cardKana !== false;
    const srcLab = v.custom ? "我的词库"
      : v.book ? bookName(v.src) + " 第" + v.l + "课"
      : (v.lv === "N5" || v.lv === "N4" ? "第" + v.l + "课" : "主题" + v.l);
    let stateLab;
    if (!c) stateLab = "　<b>新词</b>";
    else if (isLearning(c)) stateLab = "　<b>学习中</b>" + (c.lp ? " ·失误 " + c.lp + " 次" : "");
    else stateLab = "　复习 #" + c.n;
    const meta = v.lv + "　" + srcLab + "　" + esc(v.p || "")
      + stateLab
      + (S.settings.cardMode === "auto" ? "　<b>" + dirLabel(mode) + "</b>" : "")
      + (S.wrong.indexOf(v.id) >= 0 ? "　⚠ 错词" : "");
    const hasLive = hasHuman(v.w, v.k) ? '<span class="badge-live">真人</span>' : "";
    const sayBtn = function (bid) { return '<button class="chip" id="' + bid + '">🔊 朗读（S）' + hasLive + "</button>"; };

    // 正面：按练习方向渲染
    let frontBody;
    if (mode === "listen") {
      frontBody = '<button class="bigsay" id="vsay3" title="重听（S）">🔊</button>'
        + '<div class="chint">听发音 → 想出<b>这个词本身 + 它的意思</b>'
        + (S.settings.autoPlay === false ? "" : "（自动播放）") + "</div>"
        + '<div class="slowrow"><button class="chip sm" id="vsay4" title="慢速重听，听清后再回到正常速度">🐢 慢速重听</button></div>';
    } else if (mode === "mean") {
      frontBody = '<div class="cmean big">' + esc(v.z) + '</div>'
        + '<div class="chint">看着中文 → 想出<b>日文怎么写、怎么读</b></div>';
    } else {
      frontBody = wordHTML(v, showKana)
        + (v.w && !showKana ? '<div class="chint">注音已隐藏 —— 先自己回忆读音</div>' : "");
    }

    let h = '<div class="cwrap">';
    h += '<div class="cface"><div class="cmeta">' + meta + "</div>" + frontBody;
    if (mode !== "listen") h += sayBtn("vsay");
    h += '<div class="grades"><button class="btn" id="vshow">显示答案（空格）</button></div>';
    h += '<div class="hint">'
      + (mode === "listen" ? "先只听声音回忆，别急着看字 · " : mode === "mean" ? "先在脑子里拼出日文，再翻面 · " : "先自己回忆意思，再翻面 · ")
      + '快捷键 <kbd>1</kbd>忘记 <kbd>2</kbd>困难 <kbd>3</kbd>良好 <kbd>4</kbd>简单 <kbd>S</kbd>重听</div></div>';

    // 背面：完整信息（词 + 注音 + 释义 + 朗读）+ 客观评分锚点 + 语境例句
    const elapsed = vs.elapsed || 0;
    const sg = suggestGrade(elapsed, mode, vs.hint);
    const GNAMES = ["忘记", "困难", "良好", "简单"];
    const gbtn = function (cls, g, key) {
      return '<button class="g ' + cls + (elapsed && sg === g ? " rec" : "") + '" data-g="' + g + '">'
        + GNAMES[g] + '<kbd>' + key + '</kbd></button>';
    };
    h += '<div class="cface cback"><div class="cmeta">' + meta + "</div>" + wordHTML(v, true);
    h += '<div class="cmean">' + esc(v.z) + "</div>";
    h += sayBtn("vsay2");
    if (elapsed) {
      h += '<div class="gtime">你用了 <b>' + fmtSec(elapsed) + '</b> 秒'
        + (vs.hint ? '（用了提示）' : '')
        + ' → 建议评「<b>' + GNAMES[sg] + '</b>」</div>';
    }
    h += '<div class="grades">'
      + gbtn("again", 0, "1") + gbtn("hard", 1, "2") + gbtn("good", 2, "3") + gbtn("easy", 3, "4")
      + '</div>';
    h += '<div class="hint">评「忘记/困难」→ <b>1 分钟后</b>当天再来一次；走完学习步才按天间隔排复习</div>';
    const cx = ctxOf(v);
    if (cx) {
      const from = cx.kind === "read"
        ? '出自「' + esc(cx.a.t) + '」'
        : '语法例句 · ' + esc(cx.g.n);
      h += '<div class="ctxbox"><div class="ctxhead"><span class="ctxtag">例句</span>' + from + '</div>'
        + '<div class="ctxj jp">' + esc(cx.s.j) + '</div>'
        + (cx.s.z ? '<div class="ctxz">' + esc(cx.s.z) + '</div>' : '')
        + '</div>';
    }
    h += "</div>";
    h += "</div>";
    h += '<div class="combo"></div>';
    box.innerHTML = h;
    box.classList.toggle("flipped", !!vs.show);
    // 听音模式：进入卡片时自动播放一次（翻面不重播）
    if (mode === "listen" && !vs.show && S.settings.autoPlay !== false && lastSpokenId !== v.id) {
      lastSpokenId = v.id;
      setTimeout(function () { sayWord(v); }, 90);
    } else if (lastSpokenId !== v.id) { lastSpokenId = v.id; }
    // 后台预取下一张的真人音，刷卡时几乎无感
    try { prefetchNext(); } catch (e) {}
  }

  /* ---------- 10. 视图：语法 ---------- */
  let gs = { lv: "N5", q: "" };
  function viewGrammar() {
    let h = '<h2>语法库</h2><div class="chips">级别：';
    LEVELS.forEach(function (L) {
      const n = GRAMMAR.filter(function (g) { return g.lv === L; }).length;
      h += '<button class="chip' + (gs.lv === L ? " on" : "") + '" data-glv="' + L + '">' + L + '（' + n + '）</button>';
    });
    h += '</div><div class="chips"><input id="gsearch" class="inp" placeholder="搜索条目 / 意思 / 例句…" value="' + esc(gs.q) + '"></div>';
    const q = gs.q.trim().toLowerCase();
    const list = GRAMMAR.filter(function (g) {
      if (g.lv !== gs.lv) return false;
      if (!q) return true;
      return (g.n + g.m + g.f + g.e + g.t).toLowerCase().indexOf(q) >= 0;
    });
    const known = list.filter(function (g) { return S.grammar[g.id]; }).length;
    h += '<div class="rowbox"><span>本级别条目：<b>' + list.length + '</b></span><span>已掌握：<b>' + known + '</b></span></div>';
    h += '<div class="glist">';
    list.forEach(function (g) {
      const on = !!S.grammar[g.id];
      h += '<div class="gitem' + (on ? " on" : "") + '"><div class="ghead" data-gid="' + g.id + '">';
      h += '<span class="gname">' + esc(g.n) + '</span><span class="gmean">' + esc(g.m) + '</span>';
      h += '<span class="gmark">' + (on ? "已掌握" : "标记") + '</span></div>';
      h += '<div class="gbody" id="gb-' + g.id + '" style="display:none">';
      h += '<div class="gform">接续：' + esc(g.f) + '</div>';
      h += '<div class="gex">' + esc(g.e) + '　<button class="chip sm" data-say="' + esc(g.e) + '">🔊</button></div>';
      h += '<div class="gtr">' + esc(g.t) + '</div></div></div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 11. 视图：变形训练 ---------- */
  let ds = { kind: "verb", lv: "N5", q: null };
  function nextDrill() {
    if (ds.kind === "verb") {
      let pool = VERBS.filter(function (v) { return ds.lv === "ALL" || v.lv === ds.lv; });
      if (!pool.length) pool = VERBS;
      const v = pick(pool);
      const f = pick(FORMS);
      ds.q = { type: "v", w: v, form: f, ans: conj(v.k, v.t, f[0]) };
    } else {
      let pool = ADJS.filter(function (a) { return ds.lv === "ALL" || a.lv === ds.lv; });
      if (!pool.length) pool = ADJS;
      const a = pick(pool);
      const f = pick(ADJ_FORMS);
      ds.q = { type: "a", w: a, form: f, ans: conjAdj(a.k, a.t, f[0]) };
    }
  }
  function viewDrill() {
    let h = '<h2>变形训练</h2><div class="chips">类型：';
    h += '<button class="chip' + (ds.kind === "verb" ? " on" : "") + '" data-dk="verb">动词变形</button>';
    h += '<button class="chip' + (ds.kind === "adj" ? " on" : "") + '" data-dk="adj">形容词变形</button></div>';
    h += '<div class="chips">难度：';
    ["N5", "N4", "N3", "N2", "N1", "ALL"].forEach(function (L) {
      h += '<button class="chip' + (ds.lv === L ? " on" : "") + '" data-dlv="' + L + '">' + L + '</button>';
    });
    h += '</div>';
    h += '<div class="rowbox"><span>正确：<b>' + S.drill.r + '</b></span><span>错误：<b>' + S.drill.w + '</b></span><span>正确率：<b>' + (S.drill.r + S.drill.w ? Math.round(S.drill.r / (S.drill.r + S.drill.w) * 100) : 0) + '%</b></span></div>';
    h += '<div id="dq" class="qbox"></div>';
    h += '<div class="chips"><button class="chip" id="dtable">变形规则速查</button></div><div id="dextra"></div>';
    return h;
  }
  function renderDrill() {
    const box = $("#dq"); if (!box) return;
    if (!ds.q) nextDrill();
    const q = ds.q;
    let h = '<div class="qtitle">' + esc(q.w.w || q.w.k) + '　<span class="rt">' + esc(q.w.k) + '</span>　<span class="tag">' + (q.w.t === 1 ? "一类" : q.w.t === 2 ? "二类" : q.type === "v" ? "三类" : esc(q.w.t)) + '</span></div>';
    h += '<div class="qask">改成「<b>' + esc(q.form[1]) + '</b>」（' + esc(q.form[3] || "") + '）　' + esc(q.w.z) + '</div>';
    h += '<input id="dinput" class="inp big" placeholder="输入变形后的读音（假名）" autocomplete="off">';
    h += '<div class="chips"><button class="btn" id="dok">提交</button><button class="chip" id="dpass">看答案</button></div>';
    h += '<div id="dres" class="res"></div>';
    box.innerHTML = h;
    const inp = $("#dinput");
    if (inp) {
      inp.focus();
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") $("#dok").click(); });
    }
  }
  function checkDrill() {
    const inp = $("#dinput"); if (!inp) return;
    const val = inp.value.trim().replace(/\s/g, "");
    const ans = ds.q.ans;
    const ok = val === ans;
    S.drill.r += ok ? 1 : 0; S.drill.w += ok ? 0 : 1;
    S.drill.log.push({ q: ds.q.w.k, f: ds.q.form[0], ok: ok, t: Date.now() });
    if (S.drill.log.length > 200) S.drill.log = S.drill.log.slice(-200);
    save(); act();
    let h = '<span class="' + (ok ? "ok" : "no") + '">' + (ok ? "✓ 正确" : "✗ 正确：" + esc(ans)) + '</span>';
    h += '<div class="tip">';
    if (ds.q.type === "v") h += ruleText(ds.q.w.t, ds.q.form[0]);
    else h += "形容词变形规则见「变形规则速查」";
    h += '</div><button class="btn" id="dnext">下一题</button>';
    $("#dres").innerHTML = h;
  }
  function ruleText(type, form) {
    if (type === 1) {
      const M = {
        masu: "一类动词：词尾う段 → い段 + ます",
        te: "一类：く→いて／ぐ→いで／す→して／つ・る・う→って／ぬ・ぶ・む→んで（行く→行って）",
        ta: "一类：把て形的て→た、で→だ",
        nai: "一类：词尾う段 → あ段 + ない（う→わない）",
        base: "基本形（辞书形）即原形",
        kanou: "一类：词尾う段 → え段 + る",
        ishi: "一类：词尾う段 → お段 + う",
        ba: "一类：词尾う段 → え段 + ば",
        ukemi: "一类：词尾う段 → あ段 + れる",
        shieki: "一类：词尾う段 → あ段 + せる",
        meirei: "一类：词尾う段 → え段"
      };
      return M[form] || "";
    }
    if (type === 2) return "二类动词：去掉「る」＋ ます/て/た/ない/られる/よう/れば/させる/ろ";
    return "三类：する→し＋ます/て/た/ない/よう/れば；可能＝できる；受身＝される；使役＝させる（来る：きます/きて/きた/こない/こられる/こよう/くれば/こい）";
  }

  /* ---------- 11b. 视图：错词本 ---------- */
  let VMAP = null;
  function vmap() {
    if (!VMAP) {
      VMAP = {};
      LEVELS.forEach(function (L) { (VOCAB[L] || []).forEach(function (v) { VMAP[v.id] = v; }); });
    }
    return VMAP;
  }
  function wrongItems() { const m = vmap(); return S.wrong.map(function (id) { return m[id]; }).filter(Boolean); }
  function viewWrong() {
    const items = wrongItems();
    let h = '<h2>错词本</h2>';
    h += '<div class="rowbox"><span>错词：<b>' + items.length + '</b> 个</span>'
      + '<button class="btn sm" id="wtrain">开始重练</button>'
      + '<button class="chip danger" id="wclear">清空错词本</button>'
      + '<span class="tip">评「忘记/困难」的卡片会自动收集到这里</span></div>';
    if (!items.length) { h += '<p class="tip">还没有错词。去做单词卡，评「忘记」的词会出现在这里。</p>'; return h; }
    h += '<div class="glist">';
    items.slice(0, 300).forEach(function (v) {
      h += '<div class="gitem"><div class="ghead"><span class="gname jp">' + esc(v.w || v.k) + '</span>'
        + '<span class="gmean">' + esc(v.z) + '　<span class="rt">' + esc(v.k) + '</span></span>'
        + '<span class="gmark">' + v.lv + '</span></div></div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- 11a2. 视图：已学词（随手翻看） ---------- */
  /* 与「复习」的区别：复习是刷卡（要评分、进 SRS），这里是浏览（扫一眼、查词、听发音）。
     与「错词本」形态一致（列表式），但范围是「全部学过的词」，且不看到期时间。 */
  const sv = { lv: "", src: "", lesson: 0, st: "all", sort: "due", q: "", limit: 80, hideZ: false };
  const SV_STATES = [["all", "全部"], ["learning", "巩固中"], ["weak", "待巩固"], ["solid", "学得牢"], ["wrong", "错词"]];
  const SV_SORTS = [["due", "最久没复习"], ["weak", "最不熟"], ["lesson", "按课次"], ["kana", "按五十音"]];
  let svRevealed = {};        // 遮蔽模式下已点开释义的词 id
  function wrongSetOf() { const m = {}; S.wrong.forEach(function (id) { m[id] = 1; }); return m; }
  function svMatch(v, c, wset) {
    const learning = isLearning(c);
    if (sv.st === "learning" && !learning) return false;
    if (sv.st === "wrong" && !wset[v.id]) return false;
    if (sv.st === "solid" && (learning || (c.n || 0) < 4)) return false;
    if (sv.st === "weak" && (learning || (c.n || 0) >= 4)) return false;
    if (sv.q) {
      const q = sv.q.toLowerCase();
      if ((v.k + " " + (v.w || "") + " " + (v.z || "") + " " + (v.p || "")).toLowerCase().indexOf(q) < 0) return false;
    }
    return true;
  }
  /* 已学词行（带卡片状态），按当前筛选与排序。
     注意：只认 S.cards 里有的词 —— 没学过的一律不出现。 */
  function learnedRows() {
    const wset = wrongSetOf();
    const out = [];
    LEVELS.forEach(function (L) {
      if (sv.lv && L !== sv.lv) return;
      VOCAB[L].forEach(function (v) {
        if (!inScope(v, sv.src, sv.lesson)) return;
        const c = S.cards[v.id];
        if (!c) return;
        if (!svMatch(v, c, wset)) return;
        out.push({ v: v, c: c });
      });
    });
    if (sv.sort === "due") out.sort(function (a, b) { return (a.c.due || 0) - (b.c.due || 0); });
    else if (sv.sort === "weak") out.sort(function (a, b) { return (a.c.n || 0) - (b.c.n || 0); });
    else if (sv.sort === "lesson") out.sort(function (a, b) { return (a.v.l || 0) - (b.v.l || 0); });
    return out;                                            // "kana" = 保持词典原序
  }
  // 顶部统计（随级别/来源/课次变，不随状态与搜索变）
  function learnedStats() {
    const now = Date.now();
    let total = 0, learning = 0, dueNow = 0;
    LEVELS.forEach(function (L) {
      if (sv.lv && L !== sv.lv) return;
      VOCAB[L].forEach(function (v) {
        if (!inScope(v, sv.src, sv.lesson)) return;
        const c = S.cards[v.id];
        if (!c) return;
        total++;
        if (isLearning(c)) learning++;
        else if (c.due && c.due <= now) dueNow++;
      });
    });
    return { total: total, learning: learning, dueNow: dueNow };
  }
  /* 各状态的词数（按钮上标数）。基数同 learnedStats，不叠加状态筛选本身。 */
  function svCount(pred) {
    const wset = wrongSetOf();
    let n = 0;
    LEVELS.forEach(function (L) {
      if (sv.lv && L !== sv.lv) return;
      VOCAB[L].forEach(function (v) {
        if (!inScope(v, sv.src, sv.lesson)) return;
        const c = S.cards[v.id];
        if (c && pred(v, c, wset)) n++;
      });
    });
    return n;
  }
  // 「下次复习」的人话
  function dueLabel(c) {
    if (isLearning(c)) return '当天巩固中';
    const d = c.due || 0, now = Date.now();
    if (!d) return '未安排';
    if (d <= now) {
      const min = Math.round((now - d) / 60000);
      return min < 60 ? '已到期 ' + Math.max(1, min) + ' 分钟' : '已到期 ' + Math.round(min / 60) + ' 小时';
    }
    const hrs = (d - now) / 3600000;
    return hrs < 24 ? '约 ' + Math.max(1, Math.round(hrs)) + ' 小时后' : '约 ' + Math.round(hrs / 24) + ' 天后';
  }
  function viewStudied() {
    const rows = learnedRows();
    const stats = learnedStats();
    const cLearn = svCount(function (v, c) { return isLearning(c); });
    const cWrong = svCount(function (v, c, w) { return !!w[v.id]; });
    const cSolid = svCount(function (v, c) { return !isLearning(c) && (c.n || 0) >= 4; });
    const cWeak = svCount(function (v, c) { return !isLearning(c) && (c.n || 0) < 4; });

    let h = '<h2>已学词 · 随手翻看</h2>';
    h += '<p class="tip">这里是你<b>学过的全部词</b>，<b>不看到期时间</b> —— 想什么时候翻就什么时候翻。'
      + '适合扫一眼加深印象、查某个词、睡前过一遍。<b>这里不评分</b>，所以不会打乱你的复习计划。</p>';

    h += '<div class="rowbox"><span>已学：<b>' + stats.total + '</b> 个</span>'
      + (stats.learning ? '<span>巩固中：<b>' + stats.learning + '</b></span>' : '')
      + (stats.dueNow ? '<span>该复习：<b>' + stats.dueNow + '</b></span>' : '')
      + '<button class="btn sm" id="svtrain" title="拿当前筛选出的词去刷卡复习（会评分）">用这些词练一遍</button></div>';

    h += '<div class="svbar"><input class="inp svq" id="svq" placeholder="搜假名 / 汉字 / 中文释义…" value="' + esc(sv.q) + '">'
      + '<button class="chip' + (sv.hideZ ? " on" : "") + '" id="svblind" title="遮住所有释义，先自己回忆，点一条才显示">遮蔽释义：' + (sv.hideZ ? "开" : "关") + '</button></div>';

    h += '<div class="chips">状态：';
    const cntMap = { all: stats.total, learning: cLearn, weak: cWeak, solid: cSolid, wrong: cWrong };
    SV_STATES.forEach(function (s) {
      const n = cntMap[s[0]] || 0;
      if (s[0] !== "all" && !n) return;                    // 没词的状态不占位置
      h += '<button class="chip' + (sv.st === s[0] ? " on" : "") + '" data-svst="' + s[0] + '">' + s[1] + '（' + n + '）</button>';
    });
    h += '</div>';

    h += '<div class="chips">级别：<button class="chip' + (sv.lv === "" ? " on" : "") + '" data-svlv="">全部</button>';
    LEVELS.forEach(function (L) {
      const n = (VOCAB[L] || []).filter(function (v) { return !!S.cards[v.id]; }).length;
      if (!n) return;                                      // 没学过的级别不显示
      h += '<button class="chip' + (sv.lv === L ? " on" : "") + '" data-svlv="' + L + '">' + L + '（' + n + '）</button>';
    });
    h += '</div>';

    const hasBooks = !!sv.lv && booksIn(sv.lv).length > 0;
    if (hasBooks) {
      h += '<div class="chips">来源：<button class="chip' + (sv.src === "" ? " on" : "") + '" data-svsrc="">全部</button>'
        + '<button class="chip' + (sv.src === "base" ? " on" : "") + '" data-svsrc="base">内置</button>';
      booksIn(sv.lv).forEach(function (bk) {
        const n = VOCAB[sv.lv].filter(function (v) { return v.src === bk.tag && S.cards[v.id]; }).length;
        if (!n) return;
        h += '<button class="chip' + (sv.src === bk.tag ? " on" : "") + '" data-svsrc="' + bk.tag + '">' + bk.name + '（' + n + '）</button>';
      });
      h += '</div>';
    }
    if (sv.lv && (!hasBooks || sv.src !== "")) {
      h += '<div class="chips">课次：<button class="chip' + (sv.lesson === 0 ? " on" : "") + '" data-svl="">全部</button>';
      const lessons = [];
      VOCAB[sv.lv].forEach(function (v) {
        if (!S.cards[v.id] || !inScope(v, sv.src, 0)) return;
        if (v.l && lessons.indexOf(v.l) < 0) lessons.push(v.l);
      });
      lessons.sort(function (a, b) { return a - b; }).forEach(function (l) {
        const isBook = sv.src && sv.src !== "base";
        h += '<button class="chip' + (sv.lesson === l ? " on" : "") + '" data-svl="' + l + '">'
          + (isBook ? "第" + l + "课" : (sv.lv === "N5" || sv.lv === "N4" ? "第" + l + "课" : "主题" + l)) + '</button>';
      });
      h += '</div>';
    }

    h += '<div class="chips">排序：';
    SV_SORTS.forEach(function (s) {
      h += '<button class="chip' + (sv.sort === s[0] ? " on" : "") + '" data-svsort="' + s[0] + '">' + s[1] + '</button>';
    });
    h += '</div>';

    if (!rows.length) {
      h += '<div class="svempty">' + (stats.total
        ? '这个筛选下没有词<br><span class="tip">换个状态或级别看看，或把搜索词清掉</span>'
        : '还没有学过的词<br><span class="tip">先去「学新词」建立第一批，之后这里就能随时翻看了</span><br><button class="btn" data-go="learn">去学新词</button>')
        + '</div>';
      return h;
    }

    const shown = rows.slice(0, sv.limit);
    h += '<div class="svlist">';
    shown.forEach(function (r) {
      const v = r.v, c = r.c, n = c.n || 0;
      const learning = isLearning(c);
      const isWrong = S.wrong.indexOf(v.id) >= 0;
      const tag = learning ? '<span class="svtag weak">巩固中</span>'
        : isWrong ? '<span class="svtag bad">错词</span>'
          : n >= 4 ? '<span class="svtag ok">学得牢</span>'
            : '<span class="svtag">待巩固</span>';
      const srcLab = v.custom ? "我的词库"
        : v.book ? bookName(v.src) + " 第" + v.l + "课"
          : (v.lv === "N5" || v.lv === "N4" ? "第" + v.l + "课" : "主题" + v.l);
      const blind = sv.hideZ && !svRevealed[v.id];
      h += '<div class="svrow"><div class="svleft">';
      h += '<div class="svword jp">' + (v.w ? '<ruby>' + esc(v.w) + '<rt>' + esc(v.k) + '</rt></ruby>' : esc(v.k)) + '</div>';
      h += '<div class="svzh' + (blind ? " blind" : "") + '"' + (blind ? ' data-svz="' + v.id + '" title="点一下显示释义"' : "") + '>' + esc(v.z) + '</div>';
      h += '<div class="svmeta"><span class="svtag">' + v.lv + '</span><span>' + esc(srcLab) + '</span>'
        + (v.p ? '<span>' + esc(v.p) + '</span>' : '')
        + '<span>复习 ' + n + ' 次</span><span>' + dueLabel(c) + '</span>' + tag + '</div>';
      h += '</div>';
      h += '<button class="svsay" data-svsay="' + v.id + '" title="朗读">🔊</button>';
      h += '</div>';
    });
    h += '</div>';
    if (rows.length > shown.length) {
      h += '<div class="svbar"><button class="btn sm" id="svmore">加载更多（还有 ' + (rows.length - shown.length) + ' 个）</button></div>';
    }
    return h;
  }

  /* ---------- 11b. 视图：我的词库（用户自定义） ---------- */
  const cst = { tab: "vocab", q: "", lv: "N5", p: "名" };
  const PARTS = ["名", "动1", "动2", "动3", "形1", "形2", "副", "连体", "叹", "助", "接", "代"];
  function lvSelect(id, cur) {
    let s = '<select id="' + id + '" class="inp">';
    LEVELS.forEach(function (L) { s += '<option value="' + L + '"' + (L === cur ? " selected" : "") + '>' + L + '</option>'; });
    return s + '</select>';
  }
  function partSelect(id, cur) {
    let s = '<select id="' + id + '" class="inp">';
    PARTS.forEach(function (p) { s += '<option value="' + p + '"' + (p === cur ? " selected" : "") + '>' + p + '</option>'; });
    return s + '</select>';
  }
  function viewCustom() {
    const cv = customVocab(), cg = customGrammar();
    let h = '<h2>我的词库</h2>';
    h += '<p class="tip">添加的条目会<b>按你指定的等级并入对应单词卡队列</b>（或语法库），和内置内容一起复习、一起统计进度。动词若填基本形（如 つくる），还会自动进入变形训练。数据存在本机浏览器，随进度备份一起导出。</p>';
    h += '<div class="chips">';
    h += '<button class="chip' + (cst.tab === "vocab" ? " on" : "") + '" data-ctab="vocab">单词（' + cv.length + '）</button>';
    h += '<button class="chip' + (cst.tab === "grammar" ? " on" : "") + '" data-ctab="grammar">语法（' + cg.length + '）</button>';
    h += '<button class="chip' + (cst.tab === "import" ? " on" : "") + '" data-ctab="import">批量导入</button>';
    h += '</div>';

    if (cst.tab === "vocab") {
      h += '<div class="cform">';
      h += '<div class="crow">' + lvSelect("clv", cst.lv) + partSelect("cp", cst.p)
        + '<input id="ck" class="inp" placeholder="假名读音（必填，如 つくる）" autocomplete="off">'
        + '<input id="cw" class="inp" placeholder="汉字表记（选填，如 作る）" autocomplete="off">'
        + '<input id="cz" class="inp" placeholder="中文释义（必填）" autocomplete="off">'
        + '<button class="btn" id="cadd">添加</button></div>';
      h += '<div class="tip2">词性说明：动1＝五段（つくる）　动2＝一段（たべる）　动3＝する/くる　形1＝い形容词　形2＝な形容词</div>';
      h += '</div>';
      h += '<div class="crow"><input id="csearch" class="inp" placeholder="搜索已添加的词（假名 / 汉字 / 释义）" value="' + esc(cst.q) + '" autocomplete="off">'
        + '<button class="chip" id="cexport">导出词库</button>'
        + '<button class="chip danger" id="cclear">清空单词</button></div>';
      const q = cst.q.trim();
      const list = cv.filter(function (v) {
        return !q || v.k.indexOf(q) >= 0 || (v.w || "").indexOf(q) >= 0 || (v.z || "").indexOf(q) >= 0;
      }).slice().reverse();
      if (!list.length) { h += '<p class="tip">' + (cv.length ? "没有匹配的词。" : "还没有自定义单词，用上面的表单添加，或去「批量导入」一次性粘贴进来。") + '</p>'; }
      h += '<div class="glist">';
      list.slice(0, 400).forEach(function (v) {
        h += '<div class="gitem"><div class="ghead">'
          + '<span class="gname jp">' + esc(v.w || v.k) + '</span>'
          + '<span class="gmean">' + esc(v.z) + '　<span class="rt">' + esc(v.k) + '</span></span>'
          + '<span class="gmark">' + v.lv + '・' + esc(v.p || "") + '</span>'
          + '<button class="chip sm danger" data-cdel="' + v.id + '" data-ckind="vocab">删除</button>'
          + '</div></div>';
      });
      h += '</div>';
      if (list.length > 400) h += '<p class="tip">仅显示最近 400 条，可用搜索缩小范围。</p>';
    } else if (cst.tab === "grammar") {
      h += '<div class="cform">';
      h += '<div class="crow">' + lvSelect("clv", cst.lv)
        + '<input id="cgn" class="inp" placeholder="条目（必填，如 ～ことができます）" autocomplete="off">'
        + '<input id="cgf" class="inp" placeholder="接续（如 动-基本形＋）" autocomplete="off">'
        + '<input id="cgm" class="inp" placeholder="意思（必填）" autocomplete="off"></div>';
      h += '<div class="crow">'
        + '<input id="cge" class="inp" placeholder="例句（选填）" autocomplete="off">'
        + '<input id="cgt" class="inp" placeholder="例句翻译（选填）" autocomplete="off">'
        + '<button class="btn" id="caddg">添加语法</button></div>';
      h += '</div>';
      if (!cg.length) { h += '<p class="tip">还没有自定义语法条目。</p>'; }
      h += '<div class="glist">';
      cg.slice().reverse().forEach(function (g) {
        h += '<div class="gitem"><div class="ghead">'
          + '<span class="gname jp">' + esc(g.n) + '</span>'
          + '<span class="gmean">' + esc(g.m) + '　<span class="rt">' + esc(g.f || "") + '</span></span>'
          + '<span class="gmark">' + g.lv + '</span>'
          + '<button class="chip sm danger" data-cdel="' + g.id + '" data-ckind="grammar">删除</button>'
          + '</div>';
        if (g.e) h += '<div class="gex jp">' + esc(g.e) + (g.t ? '<div class="gtr">' + esc(g.t) + '</div>' : '') + '</div>';
        h += '</div>';
      });
      h += '</div>';
    } else {
      h += '<h3>批量导入</h3>';
      h += '<p class="tip">每行一条，用<b>制表符 / 逗号 / 空格</b>分隔。列数自动识别：<br>'
        + '2 列：<code>假名　中文</code><br>'
        + '3 列：<code>假名　汉字　中文</code><br>'
        + '4 列：<code>假名　汉字　中文　词性</code><br>'
        + '也支持直接粘贴 JSON 数组（含 k / w / z / p 字段）。动词建议填<b>基本形</b>。</p>';
      h += '<div class="crow">' + lvSelect("clv", cst.lv) + '<span class="tip2">整批归入</span></div>';
      h += '<textarea id="cbulk" class="inp big2" rows="10" placeholder="つくる　作る　做，制造　动1&#10;たべる　食べる　吃　动2&#10;しずか　静か　安静　形2"></textarea>';
      h += '<div class="chips"><button class="btn" id="cbulkdo">解析并导入</button><button class="chip" id="cbulkclear">清空输入框</button></div>';
      h += '<div id="cpreview"></div>';
    }
    return h;
  }

  /* ---------- 11c. 视图：听写 / 翻译练习 ---------- */
  const SCOPES = [["learned", "已学"], ["all", "本级全部"], ["wrong", "错词本"]];
  let dct = { lv: "N5", scope: "learned", q: null, r: 0, w: 0, revealed: false };
  let trn = { lv: "N5", dir: "j2c", q: null, opts: [], r: 0, w: 0, picked: -1 };

  function drillPool(scope, lv) {
    const out = [];
    LEVELS.forEach(function (L) {
      if (lv && L !== lv) return;
      VOCAB[L].forEach(function (v) {
        if (scope === "learned" && !S.cards[v.id]) return;
        if (scope === "wrong" && S.wrong.indexOf(v.id) < 0) return;
        out.push(v);
      });
    });
    return out;
  }
  // 答案归一化：去空白、全角转半角、统一小写
  function normAns(s) {
    return String(s == null ? "" : s).trim().replace(/\s+/g, "")
      .replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .toLowerCase();
  }
  function matchWord(v, val) {
    const a = normAns(val);
    if (!a) return false;
    return a === normAns(v.k) || (v.w && a === normAns(v.w));
  }

  function realSentences(a) {

  function saySentence(a, i, slow) {
    const s = a.s[i];

  let readingTimer = null;

    if (readingTimer) { clearTimeout(readingTimer); readingTimer = null; if (onEnd) onEnd(); return; }
    const list = realSentences(a);
    if (!list.length) { if (onEnd) onEnd(); return; }
    const mul = slow ? SLOW_RATE : 1;
    let i = 0;
    const step = function () {
      if (i >= list.length) { readingTimer = null; if (onEnd) onEnd(); return; }
      const j = list[i].j;
      tts(j, mul);
      const dur = Math.max(1600, (j.length * 280 + 700) / mul);   // 慢速时留更长间隔
      i++;

    h += '<div class="arow"><span class="alab">真人语速</span><input type="range" id="humanrate" min="0.6" max="1.4" step="0.05" value="' + (S.settings.humanRate || 1) + '"><span class="aval" id="humanrateval">' + (S.settings.humanRate || 1) + '</span></div>';
    h += '<div class="chips"><button class="btn sm" id="audiotest">试听语音</button><button class="chip" id="audiotest2">试听真人音（日本語）</button></div>';

      + '<button class="chip sm" id="cwarmn5">缓存 N5</button>'
      + '<button class="chip sm" id="cwarmall">缓存全部</button>'
      + '<button class="chip sm danger" id="cclearcache">清空缓存</button></div>';

      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const v = S.act[key] || 0;
      const lvl = v === 0 ? 0 : v < 10 ? 1 : v < 30 ? 2 : v < 60 ? 3 : 4;
      cells.push('<i class="h' + lvl + '" title="' + key + "：" + v + '"></i>');

    // 各级别统计
    h += '<h3>分级进度</h3><div class="lvgrid">';
    LEVELS.forEach(function (L) {
      const tot = VOCAB[L].length || 1;
      const got = VOCAB[L].filter(function (v) { return S.cards[v.id]; }).length;

      const due = VOCAB[L].filter(function (v) { const c = S.cards[v.id]; return c && c.due && c.due <= Date.now(); }).length;
      const gk = GRAMMAR.filter(function (g) { return g.lv === L && S.grammar[g.id]; }).length;
      const gt = GRAMMAR.filter(function (g) { return g.lv === L; }).length;
      h += '<div class="lvrow"><div class="lvname">' + L + '</div><div class="bar"><i style="width:' + p + '%"></i></div><div class="lvnum">' + got + '/' + tot + '（' + p + '%）　待复习 ' + due + '　语法 ' + gk + '/' + gt + '</div></div>';
    });
    h += '</div>';

    // 假名薄弱项
    const weak = Object.keys(S.kanaStat).map(function (k) {
      const s = S.kanaStat[k]; return { k: k, w: s.w, r: s.r };
    }).filter(function (x) { return x.w > 0; }).sort(function (a, b) { return b.w - a.w; }).slice(0, 12);
    if (weak.length) {
      h += '<h3>假名薄弱项（错得最多）</h3><div class="chips">';
      weak.forEach(function (x) { h += '<span class="chip warn">' + esc(x.k) + ' 错' + x.w + '</span>'; });
      h += '</div>';
    }
    return h;
  }

  /* ---------- 13. 路由 ---------- */
  const VIEWS = {
    home: viewHome, kana: viewKana, learn: viewLearn, review: viewReview,
    vocab: viewLearn,   // 兼容旧链接 → 学新词
    grammar: viewGrammar,
    drill: viewDrill, dash: viewDash, wrong: viewWrong, custom: viewCustom,
    studied: viewStudied,
    dict: viewDict, trans: viewTrans, read: viewRead, textbook: viewTextbook
  };
  function render() {
    const r = (location.hash || "#/home").replace("#/", "");
    setStateFor(r === "review" ? "review" : "learn");   // 学习与复习各用各的状态
    const fn = VIEWS[r] || VIEWS.home;
    $("#app").innerHTML = fn();
    document.querySelectorAll(".nav a").forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("href") === "#/" + r);
    });
    if (r === "kana") { nextKana(); renderKanaQ(); }
    // 离开卡片页时清空记录 —— 下次再进来会重建队列（拿到最新到期的内容）
    if (r !== "learn" && r !== "review" && r !== "vocab") lastCardRoute = null;
    if (r === "learn" || r === "review" || r === "vocab") {
      // 只有「进入这个页面」或「跨天」时才重建队列 —— 拿到最新的到期内容。
      // 页内操作（切练习方向 / 注音开关 / 评分…）一律保留当前队列与位置，
      // 否则用户点个按钮正在看的词就换掉了。
      const d = today();
      if (lastCardRoute !== r || lastCardDay !== d) {
        buildQueue(false);
        lastCardRoute = r; lastCardDay = d;
      }
      renderCard();
    }
    if (r === "drill") renderDrill();
    if (r === "dict") { if (!dct.q) nextDict(); renderDict(); }
    if (r === "trans") { if (!trn.q) nextTrans(); renderTrans(); }
    if (r === "read") {
      if (readingTimer) { clearTimeout(readingTimer); readingTimer = null; }
      bindReadInput();
    }
    if (r === "dash") setTimeout(refreshCacheCount, 0);
    window.scrollTo(0, 0);
  }

  /* ---------- 14. 事件委托 ---------- */
  document.addEventListener("click", function (e) {
    let t = e.target;
    // 点在按钮内部的 <span>/<kbd> 上时，把目标上溯到按钮本身，否则取不到它的 id
    if (t && !t.id && t.closest) { const b = t.closest("button"); if (b) t = b; }
    // 点击的可能是不带该属性的子元素（如标题里的 <span>、按钮里的 <kbd>），
    // 因此要沿祖先链向上找最近的持有者，否则「点文字没反应、点空白才有反应」
    const A = function (n) {
      if (!t) return null;
      if (t.getAttribute && t.getAttribute(n)) return t.getAttribute(n);
      const el = t.closest ? t.closest("[" + n + "]") : null;
      return el ? el.getAttribute(n) : null;
    };
    if (A("data-go")) {
      const to = A("data-go");
      // 已在目标页时 hash 不变、不会触发 hashchange，这里手动重建队列并刷新
      if (location.hash === "#/" + to) {
        setStateFor(to === "review" ? "review" : "learn");
        buildQueue(true); render();
      } else {
        location.hash = "#/" + to;
      }
      return;
    }
    if (A("data-kmode")) { kanaState.mode = A("data-kmode"); render(); return; }
    if (A("data-kscope")) { kanaState.scope = A("data-kscope"); nextKana(); render(); return; }
    if (A("data-kans")) { answerKana(A("data-kans")); return; }
    if (t.id === "kplay") { speak(kanaQ.ex); return; }
    if (t.id === "ktable") { showKanaTable(); return; }
    if (t.id === "kchart") { showChart(); return; }
    if (t.id === "wtrain") {
      const it = wrongItems();
      if (!it.length) { toast("错词本是空的"); return; }
      vs.queue = shuffle(it); vs.idx = 0; vs.show = false; location.hash = "#/vocab"; return;
    }
    if (t.id === "wclear") { if (confirm("清空错词本？")) { S.wrong = []; save(); render(); } return; }
    if (t.id === "exp") { exportData(); return; }
    if (t.id === "kconf") { showConfuse(); return; }
    /* --- 已学词页（#/studied）：筛选 / 遮蔽 / 朗读 / 拿去复习 --- */
    if (A("data-svlv") !== null) { sv.lv = A("data-svlv") || ""; sv.src = ""; sv.lesson = 0; sv.limit = 80; render(); return; }
    if (A("data-svsrc") !== null) { sv.src = A("data-svsrc") || ""; sv.lesson = 0; sv.limit = 80; render(); return; }
    if (A("data-svl") !== null) { sv.lesson = parseInt(A("data-svl"), 10) || 0; sv.limit = 80; render(); return; }
    if (A("data-svst")) { sv.st = A("data-svst"); sv.limit = 80; render(); return; }
    if (A("data-svsort")) { sv.sort = A("data-svsort"); render(); return; }
    if (A("data-svz") !== null) {
      // 点开单条释义：直接改 DOM，不整体重渲染 —— 否则滚动位置会被拉回顶部
      svRevealed[A("data-svz")] = 1;
      const node = (t.closest && t.closest("[data-svz]")) || t;
      if (node && node.classList) node.classList.remove("blind");
      if (node && node.removeAttribute) node.removeAttribute("data-svz");
      return;
    }
    if (A("data-svsay")) {
      const w = vmap()[A("data-svsay")];
      if (w) speak(w.k, { kanji: w.w, kana: w.k });
      return;
    }
    if (t.id === "svblind") { sv.hideZ = !sv.hideZ; svRevealed = {}; render(); return; }
    if (t.id === "svmore") { sv.limit += 80; render(); return; }
    if (t.id === "svtrain") {
      // 拿当前筛选去刷卡复习：级别/来源/课次带过去；「错词」状态则用只练错词模式
      let L = sv.lv;
      if (!L) {
        L = LEVELS.filter(function (x) {
          return (VOCAB[x] || []).some(function (v) { return !!S.cards[v.id]; });
        })[0];
      }
      if (!L) { toast("还没有学过的词"); return; }
      rs.lv = L; rs.src = sv.src; rs.lesson = sv.lesson;
      rs.rmode = (sv.st === "wrong") ? "wrong" : "all";
      rememberLv(rs);
      location.hash = "#/review";
      return;
    }
    if (A("data-vlv")) {
      vs.lv = A("data-vlv"); vs.lesson = 0;
      // 换了级别：若原来源（教材册）不属于该级别则重置，避免筛出空队列
      if (vs.src && vs.src !== "base" && !booksIn(vs.lv).some(function (bk) { return bk.tag === vs.src; })) vs.src = "";
      rememberLv(vs);
      buildQueue(false); render(); return;
    }
    if (A("data-vsrc") !== null) {
      vs.src = A("data-vsrc") || ""; vs.lesson = 0;
      buildQueue(true); render(); return;
    }
    // 复习选词方式（到期 / 全部已学 / 只练错词）：切换即重排队列
    if (A("data-rvmode")) {
      vs.rmode = A("data-rvmode");
      buildQueue(false); render(); return;
    }
    if (A("data-vl")) { vs.lesson = parseInt(A("data-vl"), 10) || 0; buildQueue(false); render(); return; }
    if (t.id === "vbuild" || t.id === "vbuild2") { buildQueue(true); render(); return; }
    if (t.id === "vforce" || t.id === "vforce2") { buildQueue(true, true); render(); return; }
    if (A("data-cmode")) {
      S.settings.cardMode = A("data-cmode"); save();
      lastSpokenId = null;                    // 允许新模式重新自动播放
      vs.show = false;                        // 换练法 → 这张卡从正面重看一遍，但不换词
      timedKey = "";                          // 换了练法 → 反应时间重新计时
      render(); return;
    }
    if (A("data-ckana") !== null) {
      S.settings.cardKana = A("data-ckana") === "1"; save(); render(); return;
    }
    if (A("data-cautoplay") !== null) {
      S.settings.autoPlay = A("data-cautoplay") === "1"; save(); render(); return;
    }
    if (t.id === "vsay" || t.id === "vsay2" || t.id === "vsay3" || t.id === "vsay4") {
      // 在正面点朗读 = 听了答案，算「用了提示」（听音模式本来就要听，不算）
      if (t.id === "vsay" && !vs.show) vs.hint = true;
      sayWord(vs.queue[vs.idx], t.id === "vsay4"); return;
    }
    if (t.id === "vshow") {
      if (!vs.show) vs.elapsed = elapsedMs();     // 翻面瞬间结算反应时间
      vs.show = true; renderCard(); return;
    }
    if (A("data-g")) {
      const id = vs.queue[vs.idx].id, g = parseInt(A("data-g"), 10);
      review(id, g);
      if (g <= 1) pushWrong(id); else popWrong(id);
      bumpCombo(g >= 2); addXp(g >= 2 ? 10 : 2); syncBadges();
      vs.idx++; vs.show = false; render(); return;
    }
    if (A("data-glv")) { gs.lv = A("data-glv"); render(); return; }
    if (A("data-gid")) {
      const id = A("data-gid"); const b = document.getElementById("gb-" + id);
      if (b) b.style.display = b.style.display === "none" ? "block" : "none";
      return;
    }
    const sayEl = t.getAttribute && t.getAttribute("data-say") ? t : (t.closest ? t.closest("[data-say]") : null);
    if (sayEl) { speak(sayEl.getAttribute("data-say")); return; }
    if (t.closest && t.closest(".gmark")) {
      const item = t.closest(".gitem"); const gi = item && item.querySelector(".ghead");
      if (gi) { const id = gi.getAttribute("data-gid"); if (S.grammar[id]) delete S.grammar[id]; else S.grammar[id] = 1; save(); render(); }
      return;
    }
    if (A("data-dk")) { ds.kind = A("data-dk"); ds.q = null; render(); return; }
    if (A("data-dlv")) { ds.lv = A("data-dlv"); ds.q = null; render(); return; }
    if (t.id === "dok") { checkDrill(); return; }
    if (t.id === "dnext") { nextDrill(); renderDrill(); return; }
    if (t.id === "dpass") { $("#dres").innerHTML = '<span class="no">答案：' + esc(ds.q.ans) + '</span>'; return; }
    if (t.id === "dtable") { showRuleTable(); return; }
    if (A("data-ctab")) { cst.tab = A("data-ctab"); render(); return; }
    if (t.id === "cadd") {
      const k = ($("#ck") || {}).value || "";
      const w = ($("#cw") || {}).value || "";
      const z = ($("#cz") || {}).value || "";
      const lv = ($("#clv") || {}).value || "N5";
      const p = ($("#cp") || {}).value || "名";
      const kana = k.trim().replace(/\s+/g, "");
      if (!kana) { toast("请填写假名读音"); return; }
      if (!z.trim()) { toast("请填写中文释义"); return; }
      const r = addCustom("vocab", { lv: lv, l: 0, k: kana, w: w.trim(), z: z.trim(), p: p });
      toast(r.ok ? "已添加：" + kana + (p.indexOf("动") === 0 ? "（基本形 " + masuToDict(kana) + "，已进变形训练）" : "") : r.msg);
      render(); return;
    }
    if (t.id === "caddg") {
      const n = ($("#cgn") || {}).value || "";
      const m = ($("#cgm") || {}).value || "";
      if (!n.trim()) { toast("请填写语法条目"); return; }
      if (!m.trim()) { toast("请填写意思"); return; }
      const r = addCustom("grammar", {
        lv: ($("#clv") || {}).value || "N5", l: 0, n: n.trim(),
        f: (($("#cgf") || {}).value || "").trim(), m: m.trim(),
        e: (($("#cge") || {}).value || "").trim(), t: (($("#cgt") || {}).value || "").trim()
      });
      toast(r.ok ? "已添加语法：" + n.trim() : r.msg);

      if (k === " ") {
        e.preventDefault();

          if (!vs.show) vs.elapsed = elapsedMs();   // 翻到背面 → 结算反应时间

  function exportData() {
    try {
      const blob = new Blob([JSON.stringify(S)], { type: "application/json" });

      a.href = URL.createObjectURL(blob);

  function importData(file) {
    const r = new FileReader();
    r.onload = function () {
      try {
        const o = JSON.parse(r.result);
        if (!o || !o.cards) throw new Error("bad");
        S = Object.assign(JSON.parse(JSON.stringify(DEF)), o);
        rebuildAll(); save(); render(); toast("进度已恢复");
      } catch (e) { toast("文件格式不正确"); }
    };
    r.readAsText(file);
  }
  function refreshCacheCount() {

  function startWarm(levels) {

  function exportCustom() {
    try {

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });

  function parseBulkLine(line) {
    let p = line.split("\t").map(function (s) { return s.trim(); }).filter(Boolean);
    if (p.length < 2) p = line.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (p.length < 2) p = line.split(/\s+/).map(function (s) { return s.trim(); }).filter(Boolean);
    return p;
  }
  function doBulkImport() {
    const el = $("#cbulk"); if (!el) return;
    const raw = el.value.trim();
    const box = $("#cpreview");
    if (!raw) { toast("请先粘贴内容"); return; }
    let items = [];
    // JSON 模式
    if (raw.charAt(0) === "[" || raw.charAt(0) === "{") {
      try {
        const o = JSON.parse(raw);
        const arr = Array.isArray(o) ? o : (o.vocab || []);
        items = arr.map(function (x) {
          return { lv: x.lv || ($("#clv") || {}).value || "N5", l: 0, k: (x.k || "").trim(), w: (x.w || "").trim(), z: (x.z || "").trim(), p: x.p || "名" };
        }).filter(function (x) { return x.k && x.z; });
      } catch (e) { if (box) box.innerHTML = '<p class="tip">JSON 解析失败：' + esc(e.message) + '</p>'; return; }
    } else {
      const lv = ($("#clv") || {}).value || "N5";
      raw.split(/\r?\n/).forEach(function (line) {
        if (!line.trim() || /^#/.test(line.trim())) return;
        const p = parseBulkLine(line);
        if (!p.length || !p[0]) return;
        const k = p[0].replace(/\s+/g, "");
        let w = "", z = "", pt = "名";
        if (p.length === 2) { z = p[1]; }
        else if (p.length === 3) { w = p[1]; z = p[2]; }
        else { w = p[1]; z = p[2]; pt = p[3]; }
        if (PARTS.indexOf(pt) < 0) pt = "名";
        if (k && z) items.push({ lv: lv, l: 0, k: k, w: w, z: z, p: pt });
      });
    }
    if (!items.length) { if (box) box.innerHTML = '<p class="tip">没有解析出有效条目，请检查格式。</p>'; return; }
    let added = 0, dup = 0;
    items.forEach(function (it) { const r = addCustom("vocab", it); if (r.ok) added++; else dup++; });
    if (box) {
      box.innerHTML = '<p class="tip">解析 ' + items.length + ' 条，新增 <b>' + added + '</b> 条' + (dup ? '，跳过重复 ' + dup + ' 条' : '') + '。</p>';
    }
    toast("导入完成：新增 " + added + " 条" + (dup ? "，重复 " + dup + " 条" : ""));
    if (el) el.value = "";
    render();
  }
